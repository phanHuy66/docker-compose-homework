services:
  db:
    image: postgres:17
    container_name: db_1

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  api:
    depends_on:
      db:
        condition: service_healthy
    build: ./api-server
    image: api_image
    container_name: api_1
    command: bash -c "knex migrate:latest && knex seed:run && npm start"
    ports:
      - "8080:8080"
    volumes:
      - ./api-server:/data/app
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/room', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5

  
  frontend:
    build: ./frontend-react
    image: frontend_image
    container_name: frontend_1
    command: bash -c "npm start"

    ports:
      - "3000:3000"
    volumes:
      - ./frontend-react:/data/app
    depends_on:
      api:
        condition: service_started


volumes:
  pgdata: